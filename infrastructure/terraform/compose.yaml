
services:
  floci:
    image: floci/floci:2.4.0
    container_name: floci

    ports:
      - "4566:4566"

    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

    volumes:
      - ./floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped
